directories:
  output: dist
  buildResources: build
appId: backupmessages.nemeanpartners.mac
buildVersion: '5'
productName: MessageBackup
asar: true
afterPack: scripts/after-pack.js
mac:
  category: public.app-category.productivity
  icon: build/MessageBackup.icns
  minimumSystemVersion: '12.0'
  target:
    - dmg
  extendInfo:
    ElectronTeamID: 7ZU4NQ9RVT
    ITSAppUsesNonExemptEncryption: false
mas:
  icon: build/MessageBackup.icns
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  hardenedRuntime: false
  preAutoEntitlements: false
  provisioningProfile: /Users/christinalucas/Library/MobileDevice/Provisioning Profiles/BackupMessages.provisionprofile
masDev:
  icon: build/MessageBackup.icns
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  hardenedRuntime: false
  preAutoEntitlements: false
  provisioningProfile: /Users/christinalucas/Library/MobileDevice/Provisioning Profiles/BackupMessages.provisionprofile
files:
  - filter:
      - auth.js
      - main.js
      - preload.js
      - renderer/**/*
      - web-portal-dist/**/*
      - converter.js
      - firebase-config.json
      - package.json
dmg:
  backgroundColor: '#0b0c10'
  iconSize: 128
  contents:
    - x: 130
      'y': 220
    - x: 410
      'y': 220
      type: link
      path: /Applications
electronVersion: 30.5.1
